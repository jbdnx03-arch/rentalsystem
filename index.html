const KEY_STORE='kenki-gate-key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function deriveKey(pw,salt,iter){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},base,256); }
async function decryptWith(rawKey){ const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct)); return new TextDecoder().decode(pt); }
let appHtml=null;
function launch(html){ const nm=document.getElementById('nm').value.trim(); try{ if(nm) localStorage.setItem('kenki-operator',nm); }catch(e){}
  document.open(); document.write(html); document.close(); }
async function tryOpen(pw,remember){ const err=document.getElementById('err'); err.textContent=''; document.getElementById('go').disabled=true;
  try{ const raw=await deriveKey(pw,b64(ENC.salt),ENC.iter); const html=await decryptWith(raw); appHtml=html;
    if(remember){ try{ localStorage.setItem(KEY_STORE,tob64(raw)); }catch(e){} }
    launch(html); }
  catch(e){ err.textContent='あいことばが違う'; document.getElementById('go').disabled=false; document.getElementById('pw').select(); } }
document.getElementById('f').onsubmit=e=>{ e.preventDefault(); tryOpen(document.getElementById('pw').value,document.getElementById('rem').checked); };
document.getElementById('regen').onclick=async()=>{ const err=document.getElementById('err'); const npw=document.getElementById('npw').value;
  if(!npw){ err.textContent='新しいあいことばを入れて'; return; }
  try{ if(!appHtml){ const raw=await deriveKey(document.getElementById('pw').value,b64(ENC.salt),ENC.iter); appHtml=await decryptWith(raw); } }catch(e){ err.textContent='まず今のあいことばを入れて'; return; }
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const raw=await deriveKey(npw,salt,ENC.iter); const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(appHtml));
  const tpl=document.documentElement.outerHTML.replace(/const ENC=\{[^}]*\};/,`const ENC={salt:"${tob64(salt)}",iv:"${tob64(iv)}",ct:"${tob64(ct)}",iter:${ENC.iter}};`);
  const blob=new Blob(['<!doctype html>\n'+tpl],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='index.html'; a.click();
  try{ localStorage.removeItem(KEY_STORE); }catch(e){} err.style.color='#2E7D4F'; err.textContent='index.html をダウンロードした。GitHubに上書きすれば切り替わる。'; };
(async()=>{ try{ const nm=localStorage.getItem('kenki-operator'); if(nm) document.getElementById('nm').value=nm; const k=localStorage.getItem(KEY_STORE); if(k){ const html=await decryptWith(b64(k)); launch(html); return; } }catch(e){ try{ localStorage.removeItem(KEY_STORE); }catch(x){} }
  document.getElementById(document.getElementById('nm').value?'pw':'nm').focus(); })();
</script>
